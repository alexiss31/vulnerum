# Pre-commit hooks: fast hygiene on every commit, full gates in `make ci`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=200"]
      - id: detect-private-key
      - id: check-json
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: unit-tests
        name: unit tests (no Docker)
        entry: uv run pytest -m "not docker" -x -q
        language: system
        pass_filenames: false
        types: [python]
