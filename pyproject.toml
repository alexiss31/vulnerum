[project]
name = "vulnerum"
version = "0.1.0"
description = "Run the local vulnerability lifecycle end to end: launch, verify, controlled PoC, evidence collection, Sigma detection, MITRE ATT&CK mapping, mitigation and retest."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Alexis Heugas", email = "alexisheugas@mac.home" }]
requires-python = ">=3.12"
keywords = ["security", "detection-engineering", "sigma", "mitre-attack", "cve", "docker", "lab"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12.3",
    "rich>=13.7.1",
    "pydantic>=2.7.4",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.16.0",
    "mypy>=1.13",
    "bandit>=1.8.0",
    "pip-audit>=2.7.3",
    "pre-commit>=4.0.0",
    "jsonschema>=4.22",
    "types-jsonschema>=4.22",
    "types-pyyaml>=6.0",
    "pysigma>=0.11",
]

[project.scripts]
custos = "custos_vulnerum.cli:main"

[project.urls]
Homepage = "https://github.com/alexiss31/vulnerum"
Repository = "https://github.com/alexiss31/vulnerum"
Issues = "https://github.com/alexiss31/vulnerum/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/custos_vulnerum"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "C4",     # comprehensions
    "PTH",    # pathlib
    "ARG",    # unused arguments
    "RUF",    # ruff-specific
]
ignore = [
    "SIM108",  # ternary is not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "ARG003", "ARG005"]

[tool.ruff.lint.isort]
known-first-party = ["custos_vulnerum"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config -ra"
markers = [
    "docker: end-to-end lab lifecycle tests; requires a running Docker daemon (skipped automatically when unavailable)",
]
filterwarnings = ["error"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = []
